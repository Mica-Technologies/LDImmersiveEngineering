# Shared, committed Gradle settings for this project.
#
# This file used to be gitignored, which meant heap size, encoding and network
# timeouts existed only on whichever machine happened to have written them locally —
# CI got none of them. It is tracked now; keep machine-specific absolute paths out of
# it. The JDK is selected per-environment instead (see README.md):
#   - IntelliJ  -> .idea/gradle.xml (Gradle JVM)
#   - CLI       -> ./build.sh / build.bat
#   - CI        -> actions/setup-java

# -Xmx3G: decompiling/remapping Minecraft in ForgeGradle 2.3 is memory hungry.
# -Dfile.encoding=UTF-8: pins the daemon's charset. The default is platform-dependent
# (windows-1252 locally, UTF-8 on CI), which made resource processing and javac
# produce different bytes for the same commit depending on the machine.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8

# Full stack traces on failure — legacy ForgeGradle errors are near-undiagnosable
# without them.
org.gradle.logging.stacktrace=all

# Several of the mod-compat mavens are small, self-hosted, and occasionally slow.
# Without explicit timeouts Gradle can hang for minutes on a stalled connection
# instead of failing fast. Matches the flags the CI workflows pass.
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.http.connectionTimeout=60000
