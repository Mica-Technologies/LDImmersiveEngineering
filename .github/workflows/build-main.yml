name: Build Mod (Main Branch)

# Builds the mod on every push to main and on manual dispatch, then uploads the
# resulting jar as a private GitHub Actions artifact (visible only to repo
# collaborators). It deliberately does NOT create public GitHub Releases:
# "Blu's License of Common Sense" forbids redistributing compiled builds without
# BluSunrize's explicit permission, so we keep builds private to this repo.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Rapid pushes to main would otherwise queue up full builds behind each other.
# Unlike the PR workflow this does NOT cancel in progress: a push to main should
# always produce its artifact.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build_mod:
    name: Build Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Legacy Forge 1.12.2 (ForgeGradle 2.3 / Gradle 4.10.3) must build on JDK 8.
      # build.gradle fails fast with an explanatory message if this is ever wrong.
      - name: Set Up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The -D timeouts are also in gradle.properties; they are repeated here so the
      # command stays correct if it is ever run outside the project directory.
      - name: Assemble mod with Gradle
        run: >-
          ./gradlew setupCiWorkspace build
          -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000
          -Dorg.gradle.internal.http.socketTimeout=60000
          -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          retention-days: 7

      # Private artifact only — NOT a public release. See the note at the top of this file.
      - name: Upload mod jar (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: immersiveengineering-jar
          path: build/libs/*.jar
          retention-days: 90
          if-no-files-found: error
