name: Test Mod Build (Pull Request)

on: pull_request

jobs:
  test_assemble_mod:
    name: Test Assemble Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Legacy Forge 1.12.2 (ForgeGradle 2.3 / Gradle 4.1) must build on JDK 8.
      - name: Set Up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble mod with Gradle
        run: ./gradlew setupCiWorkspace build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000
